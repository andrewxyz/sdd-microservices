name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers talks to the runner's own Docker daemon.
      - name: Build and test
        run: mvn -f backend/pom.xml -B verify

  scripts:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck scripts/up.sh scripts/smoke-test.sh \
                     scripts/tests/up-preflight.test.sh scripts/tests/fakebin/docker \
                     backend/docker/db-init/provision.sh

      - name: Preflight checks of up.sh
        run: bash scripts/tests/up-preflight.test.sh

  stack:
    name: Start the platform and smoke test it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the Compose version
        # Research R12 measured one-shot container handling on Compose 2.40.3; if a runner ships a
        # version that behaves differently, this line is the first place to look.
        run: docker compose version

      - name: Pull third-party images
        # Explicit, so a tag that disappears upstream fails here rather than mid-test.
        run: |
          docker pull postgres:16
          docker pull rabbitmq:4.3-management
          docker pull axllent/mailpit

      - name: Prepare settings
        run: cp .env.example .env

      - name: Start the platform (cold, builds images)
        run: |
          start=$SECONDS
          scripts/up.sh
          echo "COLD_START_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: Smoke test (default checks)
        run: scripts/smoke-test.sh

      - name: Smoke test (two echo copies, load spread and crash handling)
        run: scripts/smoke-test.sh --scale

      - name: Smoke test (config server down: FR-017 fail-fast, end to end)
        run: scripts/smoke-test.sh --config-down

      - name: Smoke test (non-local profile: FR-018 login required, end to end)
        run: scripts/smoke-test.sh --auth-profile

      - name: Smoke test (lifecycle: restart keeps data, down -v wipes it)
        run: scripts/smoke-test.sh --lifecycle

      - name: Time a warm start
        run: |
          docker compose down
          start=$SECONDS
          scripts/up.sh
          echo "WARM_START_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: Report start times against the SC-001 budgets
        # SC-001: under 10 minutes cold (building images), under 3 minutes warm.
        run: |
          echo "Cold start: ${COLD_START_SECONDS}s (budget 600s)"
          echo "Warm start: ${WARM_START_SECONDS}s (budget 180s)"
          failed=0
          [ "${COLD_START_SECONDS}" -le 600 ] || { echo "cold start exceeded its budget"; failed=1; }
          [ "${WARM_START_SECONDS}" -le 180 ] || { echo "warm start exceeded its budget"; failed=1; }
          exit $failed

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
