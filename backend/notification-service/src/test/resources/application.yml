# Test defaults, replacing the service's own application.yml on the test classpath.
#
# The real file imports settings from the config server; that import is declared inside the file and
# is processed while the file loads, so only replacing the file (not an external property) can cancel
# it. Datasource, RabbitMQ and SMTP settings come from each test class's @DynamicPropertySource, pointed
# at Testcontainers instances, including a real Mailpit container (constitution Principle VI:
# Testcontainers, never H2, and never a mocked broker or mail server).

spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
    loadbalancer:
      # Safe only because the urls below are never empty for any test in this module (so the
      # load-balanced "else" branch in FeignClientFactoryBean is never needed): Spring Cloud LoadBalancer
      # does not reliably honor a per-client static URL for a Feign call made from a @RabbitListener
      # thread (research.md finding), so calls must bypass it entirely via @FeignClient(url=...).
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Harmless placeholders so @FeignClient(url = "${...:}")'s url is never empty for any notification-service
# test — an empty url routes through Spring Cloud LoadBalancer's "lb://" resolution (research.md finding:
# unreliable from a @RabbitListener thread, with no Eureka instances registered in tests anyway). Tests
# that actually call these clients override them via @DynamicPropertySource; tests that don't never dial
# them, so the unreachable port is never a problem.
auth-service:
  url: http://localhost:1
course-service:
  url: http://localhost:1

platform:
  config-watcher:
    enabled: false

feign:
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      course-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      auth-service:
        timeout-duration: 15s
        cancel-running-future: true
      course-service:
        timeout-duration: 15s
        cancel-running-future: true
