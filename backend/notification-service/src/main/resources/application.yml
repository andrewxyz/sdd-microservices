# The minimum a service declares itself: who it is, where to bootstrap its configuration from, and the
# credentials to do so. Everything else (registry, probes, logging, retry) arrives from the config
# server's shared defaults, same as every other service. Datasource, RabbitMQ and SMTP connection
# settings are supplied by docker-compose.yml / config-repo/notification-service.yml.

spring:
  application:
    name: notification-service
  config:
    import: "configserver:${CONFIG_SERVER_URL}"
  cloud:
    config:
      username: ${CONFIG_USER}
      password: ${CONFIG_PASSWORD}
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 6000
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

feign:
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      course-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      auth-service:
        timeout-duration: 3s
        cancel-running-future: true
      course-service:
        timeout-duration: 3s
        cancel-running-future: true

server:
  port: 9007
