# Gateway routes and policy. Edited here, picked up by the running gateway within about ten seconds.
#
# Two routes for one service: metadata.public applies to a whole route, and echo has one public path
# and one protected path. The narrow public route is matched first; the catch-all behind it is
# protected, so any echo path not listed as public stays protected by default.

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:9100"
                  - "http://localhost:9000"
                  - "http://localhost:5173"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: echo-public
              uri: lb://echo-service
              order: 0
              predicates:
                - Path=/api/v1/echo/ping
              metadata:
                public: true

            - id: echo
              uri: lb://echo-service
              order: 1
              predicates:
                - Path=/api/v1/echo/**

            # register/login/refresh stay open; everything else under /api/v1/auth/** is protected by
            # default (specs/002-user-auth research.md R5), same echo-public/echo pattern as above.
            - id: auth-public
              uri: lb://auth-service
              order: 2
              predicates:
                - Path=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh
              metadata:
                public: true

            # Narrower than the general auth route below, so only this path carries the role
            # restriction (FR-019, research.md R5).
            - id: auth-admin
              uri: lb://auth-service
              order: 3
              predicates:
                - Path=/api/v1/auth/accounts/**
              metadata:
                roles: [ADMINISTRATOR]

            - id: auth
              uri: lb://auth-service
              order: 4
              predicates:
                - Path=/api/v1/auth/**

            # specs/003-course-catalog research.md R2: the single-segment `*` below matches exactly one
            # path element, so it can never also match a deeper path like /api/v1/courses/{id}/publish
            # or /api/v1/courses/{id}/lessons/** — no ordering trick is needed to keep those separate
            # from this route, only from the double-star catch-all below (which, like `**` everywhere
            # else in this file, does overlap and so must be ordered last).
            - id: courses-public-list
              uri: lb://course-service
              order: 5
              predicates:
                - Path=/api/v1/courses
                - Method=GET
              metadata:
                public: true

            - id: courses-public-detail
              uri: lb://course-service
              order: 6
              predicates:
                - Path=/api/v1/courses/*
                - Method=GET
              metadata:
                public: true

            - id: categories-public-list
              uri: lb://course-service
              order: 7
              predicates:
                - Path=/api/v1/categories
                - Method=GET
              metadata:
                public: true

            # Administrator-only for every category mutation (create/rename/delete), same mechanism as
            # auth-admin.
            - id: categories-admin
              uri: lb://course-service
              order: 8
              predicates:
                - Path=/api/v1/categories/**
              metadata:
                roles: [ADMINISTRATOR]

            # An instructor's own listing lives at a structurally distinct top-level path, not a
            # sibling of /api/v1/courses/*, so it can never be mistaken for a course id (research.md R2).
            - id: my-courses
              uri: lb://course-service
              order: 9
              predicates:
                - Path=/api/v1/my/courses

            # Reading a course's full lesson content (004-checkout-enrollment, research.md R5): gated by
            # ownership, admin role, or confirmed enrollment, all enforced inside course-service itself.
            # A narrower, two-segment shape than courses-manage below, so it is matched first regardless
            # of relative order — kept lower anyway for the same discipline 002/003 established.
            - id: course-content
              uri: lb://course-service
              order: 10
              predicates:
                - Path=/api/v1/courses/*/content
                - Method=GET

            # Everything else: create, edit, delete, publish, archive, the owner/admin full detail
            # view, and all lesson management. Protected (any authenticated caller); ownership and role
            # nuance are enforced inside course-service itself (research.md R9).
            - id: courses-manage
              uri: lb://course-service
              order: 15
              predicates:
                - Path=/api/v1/courses/**

            # 004-checkout-enrollment: check out a published course (research.md R7). Protected;
            # instructor-self-checkout and already-enrolled refusals are enforced inside payment-service.
            - id: checkout
              uri: lb://payment-service
              order: 16
              predicates:
                - Path=/api/v1/checkouts
                - Method=POST

            # A user's own payment history and a single payment's status (FR-017, FR-019). Protected;
            # ownership is enforced inside payment-service (identical 404 for someone else's payment).
            - id: payments
              uri: lb://payment-service
              order: 17
              predicates:
                - Path=/api/v1/payments/**

            # A user's own enrollments (FR-018), plus (005-progress-certificates-notifications) lesson
            # progress and completion under the same caller-scoped enrollment: PUT/DELETE
            # .../lessons/{lessonId}/complete and GET .../progress. Widened from an exact match to a
            # catch-all so those new sub-paths are actually covered — research.md R9's "falls under the
            # existing route" only holds once this predicate is a prefix, not an exact path. Protected;
            # ownership/enrollment scoping enforced inside enrollment-service.
            - id: enrollments
              uri: lb://enrollment-service
              order: 18
              predicates:
                # AntPathMatcher's ** also matches the bare prefix itself, so this still covers the
                # original GET /api/v1/enrollments list as well as the new sub-paths.
                - Path=/api/v1/enrollments/**

            # 005-progress-certificates-notifications: a student's own certificates (FR-013).
            - id: certificates-mine
              uri: lb://certificate-service
              order: 19
              predicates:
                - Path=/api/v1/certificates/mine
                - Method=GET

            # 005-progress-certificates-notifications: public certificate verification (FR-015 to
            # FR-018), with a stricter, route-specific rate limit (research.md R8) since this is a
            # public, unauthenticated, guessable-code endpoint.
            - id: certificates-verify
              uri: lb://certificate-service
              order: 20
              predicates:
                - Path=/api/v1/certificates/verify/**
                - Method=GET
              metadata:
                public: true
                rate-limit: strict

  # Needed for the correlation ID to survive across reactive operators and reach log lines.
  reactor:
    context-propagation: auto

platform:
  gateway:
    rate-limit:
      # Chosen in research R8: high enough that the 100-call smoke checks pass, low enough that a
      # concurrent burst of 400 trips it.
      capacity: 200
      refill-per-second: 100
      idle-eviction: PT10M
    # 005-progress-certificates-notifications research.md R8: a stricter, route-scoped bucket for
    # /api/v1/certificates/verify/** — a public, guessable-code endpoint, independent of the general
    # bucket above.
    rate-limit-strict:
      capacity: 10
      refill-per-second: 2
      idle-eviction: PT10M
