# Settings for the auth service.
#
# Nothing here is a secret: JWT_SIGNING_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD and the database
# credentials are deployment secrets supplied as environment variables directly, the same way
# EUREKA_URL and CONFIG_USER/CONFIG_PASSWORD are supplied to every other service, not through this
# file. This file exists so auth-service participates in the non-optional config-server import like
# every other business service (constitution Principle III); it has no refreshable setting yet.
