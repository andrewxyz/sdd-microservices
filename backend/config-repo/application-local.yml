# Local development overrides.
#
# The refresh endpoint is exposed here only. The config watcher already applies edits within about
# ten seconds without it (FR-016); this is for a developer who wants to force the update by hand.
# Outside the local profile it stays closed.
#
# This list overrides application.yml's rather than merging with it, so it has to repeat every
# endpoint that should stay open — including prometheus. Dropping prometheus here would close the
# scrape endpoint in the one profile development actually runs under.

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
