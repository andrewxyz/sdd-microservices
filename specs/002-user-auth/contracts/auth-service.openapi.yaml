openapi: 3.0.3
info:
  title: LearnHub auth-service
  version: "1.0.0"
  description: >
    Reached only through the gateway at /api/v1/auth/**. register, login and refresh are public
    (no token required); every other path requires a valid access token, and the role-change path
    additionally requires the ADMINISTRATOR role, both enforced by the gateway before the request
    reaches this service (research.md R5). Every error response uses the shared
    problem-details.schema.json shape (specs/001-platform-foundation/contracts/).
servers:
  - url: /api/v1/auth
paths:
  /register:
    post:
      summary: Create a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  role: { type: string, enum: [STUDENT] }
                  createdAt: { type: string, format: date-time }
        "409":
          description: Email already registered (FR-002)
        "422":
          description: Password does not meet the strength rule (FR-003)

  /login:
    post:
      summary: Exchange credentials for an access token and a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Wrong email or password (same generic error either way, FR-007)
        "429":
          description: Too many failed attempts for this account or source address (FR-008)

  /refresh:
    post:
      summary: Exchange a valid, unused refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: A new access token and a new refresh token (the old refresh token is now used)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token missing, expired, already used, or revoked (FR-011)

  /logout:
    post:
      summary: Revoke the refresh token for the current session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Session's refresh token revoked (FR-010); other sessions on the same account are unaffected
        "401":
          description: No valid access token presented

  /me:
    get:
      summary: View the caller's own account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's own profile, never including password or token data (FR-023)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  role: { type: string, enum: [STUDENT, INSTRUCTOR, ADMINISTRATOR] }
                  createdAt: { type: string, format: date-time }
        "401":
          description: No valid access token presented

  /accounts/{accountId}/role:
    patch:
      summary: Change another account's role (administrator only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [STUDENT, INSTRUCTOR, ADMINISTRATOR] }
      responses:
        "200":
          description: Role updated; takes effect for the target account on its next login (FR-021)
        "401":
          description: No valid access token presented
        "403":
          description: >
            Caller's token role is not ADMINISTRATOR. Enforced by the gateway (this route is
            metadata.roles-restricted, research.md R5) before the request reaches this service.
        "409":
          description: Change would leave the platform with zero administrator accounts (FR-014)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Documented for completeness; in practice the caller never reaches this service without the
        gateway already having verified the token and replaced it with X-User-Id / X-User-Role
        headers (FR-020). This service does not accept or parse a raw token itself.
  schemas:
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: "JWT; see jwt-claims.schema.json for its claims" }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, example: 900 }
