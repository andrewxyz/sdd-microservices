# Research check R12: does `docker compose up --wait` tolerate a one-shot container that exits 0?
# Variant A (profile "instant"): the one-shot exits immediately.
# Variant B (profile "delayed"): the one-shot sleeps 2s first.
# In both, a long-running service with a healthcheck depends on it completing successfully.
services:
  oneshot-instant:
    image: busybox:1.36
    profiles: ["instant"]
    command: ["true"]

  longrunning-instant:
    image: busybox:1.36
    profiles: ["instant"]
    command: ["sh", "-c", "touch /tmp/ready && sleep 3600"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    depends_on:
      oneshot-instant:
        condition: service_completed_successfully

  oneshot-delayed:
    image: busybox:1.36
    profiles: ["delayed"]
    command: ["sh", "-c", "sleep 2"]

  longrunning-delayed:
    image: busybox:1.36
    profiles: ["delayed"]
    command: ["sh", "-c", "touch /tmp/ready && sleep 3600"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    depends_on:
      oneshot-delayed:
        condition: service_completed_successfully
